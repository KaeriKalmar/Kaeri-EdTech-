<!DOCTYPE html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb"><title>Learning Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--inset:#eef1f6;--line:#e3e8f0;--head:#101828;--ink:#475467;--mute:#8a94a6;--acc:#4f46e5;--acc-h:#4338ca;--acc-s:rgba(79,70,229,.12);--acc-t:#fff;--ok:#12b76a;--warn:#f79009;--bad:#f04438;--sh:0 1px 2px rgba(16,24,40,.05),0 10px 28px -14px rgba(16,24,40,.14);--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
html[data-theme=dark]{--bg:#0b1220;--card:#121b2e;--inset:#0e1627;--line:#23314d;--head:#eef2fa;--ink:#a8b3c7;--mute:#76839b;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 32px -14px rgba(0,0,0,.65);color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1100px 480px at 88% -8%,var(--acc-s),transparent 62%) no-repeat fixed,var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;color:var(--head);line-height:1.2}h2{font-size:1.05rem;font-weight:700;margin:26px 0 12px}h3{font-size:.95rem;font-weight:700}
p{margin:.3em 0}a{color:var(--acc)}b{color:var(--head)}small,.mut{color:var(--mute);font-size:.82rem}.acc{color:var(--acc)}.hide{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--head);margin:6px 0 14px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
input[type=checkbox],input[type=radio]{width:auto;margin:0}input[type=color]{padding:3px;height:44px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--head)}textarea{resize:vertical;min-height:78px}
:focus-visible{outline:3px solid var(--acc-s);outline-offset:2px}
/* buttons: one spinner language everywhere */
.btn{--spin:var(--acc-t);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-t);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,box-shadow .15s,background .15s}
.btn:hover:not(:disabled){background:var(--acc-h);box-shadow:0 8px 18px -10px var(--acc)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.soft{--spin:var(--acc);background:var(--acc-s);color:var(--acc);border-color:transparent}.btn.soft:hover:not(:disabled){background:var(--acc-s);filter:brightness(.96);box-shadow:none}
.btn.ghost{--spin:var(--acc);background:transparent;color:var(--head);border-color:var(--line)}.btn.ghost:hover:not(:disabled){background:var(--inset);box-shadow:none}
.btn.ok{--spin:#fff;background:var(--ok);border-color:var(--ok);color:#fff}.btn.danger{--spin:var(--bad);background:rgba(240,68,56,.1);color:var(--bad);border-color:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:.84rem;border-radius:10px}.btn.full{width:100%;min-height:48px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.is-busy{background:#94a3b8!important;border-color:#94a3b8!important;color:#fff!important;pointer-events:none;cursor:progress;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:none!important}.bspin{width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-right-color:#fff;border-radius:50%;animation:rot .7s linear infinite;flex:none}
.spin::after{content:"";position:absolute;width:16px;height:16px;left:calc(50% - 8px);top:calc(50% - 8px);border:2px solid var(--spin);border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
.spin{position:relative;display:inline-block;width:28px;height:28px;--spin:var(--acc)}.spin::after{width:22px;height:22px;left:3px;top:3px;border-width:3px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--head);cursor:pointer}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--inset) 25%,var(--line) 37%,var(--inset) 63%);background-size:400% 100%;animation:shim 1.3s ease infinite;min-height:12px}
.sk-row{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin:10px 0}
@media(prefers-reduced-motion:reduce){.sk,.btn.is-busy::after,.spin::after{animation-duration:3s}}
/* shell */
.shell{min-height:100dvh}.side{position:fixed;inset:0 auto 0 0;width:252px;z-index:40;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;transition:transform .22s}
.side-brand{padding:4px 8px 16px}.side nav{display:flex;flex-direction:column;gap:4px;flex:1}.side-foot{border-top:1px solid var(--line);padding-top:10px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:none;color:var(--ink);font-weight:600;cursor:pointer;text-align:left;position:relative}
.nv:hover{background:var(--inset)}.nv.on{background:var(--acc-s);color:var(--acc)}.nv svg{flex:none}
.dot-n{margin-left:auto;background:var(--acc);color:var(--acc-t);font-style:normal;font-size:.72rem;font-weight:700;min-width:22px;height:22px;display:grid;place-items:center;border-radius:11px;padding:0 6px}
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:39;display:none}
.main{margin-left:252px}.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar h1{font-size:1.15rem}.menu-b{display:none}.page{padding:20px;max-width:1080px;margin:0 auto;animation:up .25s ease}
@media(max-width:959px){.side{transform:translateX(-102%)}.side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.35)}.side.open~.scrim{display:block}.main{margin-left:0}.menu-b{display:grid}.page{padding:14px}}
/* cards, stats, chips */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin:12px 0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}.ch h2{margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}.stat small{font-weight:600;text-transform:uppercase;letter-spacing:.05em}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.stat b{font-size:1.35rem}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:.72rem;color:var(--mute)}
.bc i{width:100%;background:linear-gradient(var(--acc2,var(--acc)),var(--acc));border-radius:8px 8px 3px 3px;display:block}
.chip,.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.74rem;font-weight:700;background:var(--inset);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.badge.ok,.badge.Active{background:rgba(18,183,106,.12);color:var(--ok);border-color:transparent}.badge.warn,.badge.Unpaid,.badge.Pending_Verification{background:rgba(247,144,9,.14);color:var(--warn);border-color:transparent}
.badge.bad,.badge.Expired,.badge.Rejected,.badge.Suspended{background:rgba(240,68,56,.12);color:var(--bad);border-color:transparent}.badge.acc{background:var(--acc-s);color:var(--acc);border-color:transparent}
.seg{display:inline-flex;background:var(--inset);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:.82rem;color:var(--ink);cursor:pointer}.seg .on{background:var(--card);color:var(--acc);box-shadow:var(--sh)}
/* toolbar */
.tool{display:flex;flex-direction:column;gap:10px}.srch{position:relative}.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute)}.srch input{margin:0;padding-left:42px}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.fr select{width:auto;margin:0;flex:1;min-width:120px}
/* responsive table -> cards */
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:8px 12px}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}.tbl tr:hover td{background:var(--inset)}
.thumb{width:62px;height:44px;border-radius:10px;background:var(--inset) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);flex:none;overflow:hidden}.thumb.has svg{display:none}
.tt{display:flex;gap:12px;align-items:center;min-width:0}.tt b{display:block;overflow:hidden;text-overflow:ellipsis;max-width:340px;white-space:nowrap}
@media(max-width:720px){.tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}.tbl tr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;box-shadow:var(--sh)}
.tbl tr:hover td{background:none}.tbl td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.tbl td::before{content:attr(data-l);color:var(--mute);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tbl td.nl{display:block}.tbl td.nl::before{display:none}.tbl td.nl .btn{width:100%;margin-top:6px}.tt b{max-width:60vw}}
details.grp{margin:14px 0}details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700;color:var(--head);padding:8px 2px}details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s}details.grp[open]>summary::before{transform:rotate(45deg)}
.empty{text-align:center;padding:36px 12px;color:var(--mute)}
/* slide-over */
.so{position:fixed;inset:0;z-index:70;display:none}.so.on{display:block}.so-bg{position:absolute;inset:0;background:rgba(8,12,24,.55);backdrop-filter:blur(3px)}
.so-p{position:absolute;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25);animation:soIn .22s ease}
.so-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}.so-h h2{margin:0}.so-b{flex:1;overflow:auto;padding:16px 18px 40px}
@keyframes soIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}@keyframes soUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:720px){.so-p{top:auto;height:92dvh;border-radius:22px 22px 0 0;animation:soUp .25s ease}}
.hero{aspect-ratio:16/9;border-radius:16px;background:var(--inset) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);margin-bottom:12px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.85rem;margin:8px 0 16px}.kv span:nth-child(odd){color:var(--mute)}.kv span:nth-child(even){color:var(--head);word-break:break-all}
.prog{height:10px;background:var(--inset);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.switch{display:flex;align-items:center;gap:10px;margin:0 0 14px;cursor:pointer;font-size:.9rem}.switch input{width:20px;height:20px;accent-color:var(--acc)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;border:2px dashed var(--line);border-radius:16px;text-align:center;color:var(--ink);cursor:pointer;margin-bottom:14px;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;height:100%}.drop:hover{border-color:var(--acc);background:var(--acc-s)}
/* pending */
.pend{display:flex;gap:14px}.pthumb{width:84px;height:84px;border-radius:14px;background:var(--inset) center/cover no-repeat;flex:none;cursor:pointer;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line)}.pbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
/* student */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}.lc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;text-align:left;padding:0}
.lc:hover{transform:translateY(-2px);border-color:var(--acc)}.lc .th{aspect-ratio:16/10;background:var(--inset) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);position:relative}.lc.lock .th{filter:saturate(.6)}
.lc .th .tag{position:absolute;top:8px;right:8px}.lc .lb{padding:10px 12px}.lc .lb b{display:block;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.9rem}
.plan{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px;margin:8px 0;cursor:pointer}.plan.on{border-color:var(--acc);background:var(--acc-s)}
.pay{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--inset)}.pay code{font:600 1rem ui-monospace,monospace;color:var(--head)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2,var(--acc)));color:var(--acc-t);box-shadow:var(--sh)}.top h1{color:inherit;font-size:1.2rem}
.top .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:inherit}.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.logo{height:34px;max-width:150px;object-fit:contain;border-radius:9px}.brandrow{display:flex;align-items:center;gap:10px}.brandrow h1{font-size:1.1rem;font-weight:800;color:inherit;white-space:nowrap}
.auth{max-width:440px;margin:7vh auto 0;padding:0 16px}.auth .card{padding:24px}
.foot{text-align:center;padding:24px 16px 40px;color:var(--mute);font-size:.82rem}.foot a{color:var(--ink);text-decoration:none;font-weight:600}.fl{display:inline-flex;gap:6px;align-items:center;margin-bottom:6px}.foot a.wag{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;margin-bottom:12px;box-shadow:0 8px 18px -8px rgba(37,211,102,.7)}.wag svg{width:18px;height:18px;fill:currentColor}.avt{border-radius:50%;object-fit:cover;display:block;flex:none}.av-ph{border-radius:50%;background:var(--acc-s);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
/* dialog + toast */
#dlg{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(8,12,24,.6);padding:16px;backdrop-filter:blur(3px)}#dlg.on{display:grid}
.dg{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:400px;box-shadow:0 30px 70px rgba(0,0,0,.4);animation:up .2s ease}.dg h3{margin-bottom:6px;font-size:1.1rem}.dg p{margin:0 0 14px}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 24px));pointer-events:none}
.tst{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--head);border:1px solid var(--line);border-left:4px solid var(--ok);padding:12px 12px 12px 14px;border-radius:14px;font-weight:600;font-size:.92rem;box-shadow:0 16px 40px rgba(0,0,0,.22);animation:tin .28s cubic-bezier(.2,.9,.3,1.2)}
.tst.out{opacity:0;transform:translateY(-10px);transition:.22s}.tst .ti{display:grid;place-items:center;color:var(--ok);flex:none}.tst .tm{flex:1;min-width:0;line-height:1.35}.tst button{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px;border-radius:8px;display:grid;place-items:center}
.tst.bad{border-left-color:var(--bad)}.tst.bad .ti{color:var(--bad)}.tst.warn{border-left-color:#d97706}.tst.warn .ti{color:#d97706}.tst.info{border-left-color:var(--acc)}.tst.info .ti{color:var(--acc)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
.bcard.busy{opacity:.75;pointer-events:none}.bcard{margin:10px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--inset)}.bcard .chip.ok{background:var(--ok);color:#fff}.bcard .chip.warn{background:#94a3b8;color:#fff}.bcard .chip.bad{background:var(--bad);color:#fff}.bcard .err{color:var(--bad);font-size:.8rem;margin-top:6px}
.cd .cdn{font-size:1.7rem;font-weight:800;color:var(--acc);letter-spacing:-.02em}.cd small{letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.pvm{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}.pvb{position:relative;width:min(720px,100%);background:var(--card);border-radius:16px;padding:14px}.pvb .ibtn{position:absolute;top:8px;right:8px;z-index:2}
.dev{opacity:.75;font-size:.8rem}

/* draggable whatsapp */
.wa{position:fixed;z-index:35;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -6px rgba(37,211,102,.6);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:left .22s ease,top .22s ease,transform .15s}
.wa.drag{transition:none;cursor:grabbing;transform:scale(1.08)}.wa svg{width:30px;height:30px;fill:currentColor}body.tr-open .wa,.so.on~.wa{display:none}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:8px 0 16px}.pt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-weight:600;font-size:.78rem;color:var(--ink)}
.pt i{width:100%;height:34px;border-radius:9px;display:block}.pt.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-s);color:var(--head)}
.pk{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:rgba(8,12,24,.62);padding:12px;backdrop-filter:blur(3px)}.pk.on{display:grid}
.pk-p{background:var(--bg);border:1px solid var(--line);border-radius:22px;width:min(640px,100%);height:min(720px,92dvh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:up .2s ease}
.pk-t{padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px}.pk-t .srch input{margin:0}.pk-c{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:.8rem;min-height:24px}.pk-cb{border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:2px 4px;border-radius:6px}.pk-cb:last-child{color:var(--head)}
.pk-b{flex:1;overflow:auto;padding:0 12px}.pk-r{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}.pk-r:hover{background:var(--inset)}.pk-r.sel{background:var(--acc-s)}
.pk-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--inset);color:var(--mute);flex:none}.pk-r .nm,.pkchip .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--head)}

.tr-wait{display:none;position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:trr .9s linear infinite;pointer-events:none}
.tr-err{display:none;position:absolute;inset:0;z-index:5;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(0,0,0,.88)}
.tr-ctl{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;padding:28px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.78));transition:opacity .25s}
.tr-seek input{width:100%;margin:0;padding:0;border:0;background:none;accent-color:var(--acc,#4f46e5)}
.tr-vr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tr-vr .tr-b{height:38px;background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.tr-time{font-size:.8rem;color:#e2e8f0;min-width:92px}
@media print{body.tr-open>*{display:none!important}body.tr-open::before{content:"Protected content - printing is disabled.";display:block;padding:48px 24px;font:20px/1.4 sans-serif;color:#000}}
@media (prefers-reduced-motion:reduce){.tr-sk,.tr-wait{animation:none}}
.tr-scroll{align-items:stretch}.tr-pg{width:calc(100% * var(--tr-z,1));max-width:calc(980px * var(--tr-z,1));margin:0 auto}
.tr-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.tr-grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;font-size:.78rem}
.tr-grid canvas{width:100%;height:auto;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.25)}

    if (k === 'ArrowRight' || k === 'n' || k === 'N') { e.preventDefault(); go(D.cur + 1, true); }
    else if (k === 'ArrowLeft' || k === 'p' || k === 'P') { e.preventDefault(); go(D.cur - 1, true); }
    else if (k === 'Home') { e.preventDefault(); go(1); } else if (k === 'End') { e.preventDefault(); go(D.n); }
    else if (k === 'g' || k === 'G' || k === '/') { e.preventDefault(); openJump(); }
    else if ((k === 'f' || k === 'F') && canFs) docAct('fs');
    else if (k === '?' || k === 'h' || k === 'H') toggleHelp();
    else if (k === '+' || k === '=') zoom(1); else if (k === '-') zoom(-1);
  }

  /* ═════════ VIDEO PLAYER ═════════ */
  var RATES = [1, 1.25, 1.5, 2, 0.75];
  function buildVid() {
    if (V.ov) return;
    V.ov = el('<div class="tr-ov tr-vid" role="dialog" aria-modal="true" aria-label="Video">' +
      '<div class="tr-top"><b class="tr-title"></b><button class="tr-b x" data-a="close">✕ Close</button></div>' +
      '<div class="tr-stage"><video playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noremoteplayback"></video>' +
      '<button class="tr-big" data-a="toggle" aria-label="Play">▶</button><div class="tr-wait"></div>' +
      '<div class="tr-err"><p></p><button class="tr-b p" data-a="retry">Try again</button></div>' +
      '<div class="tr-ctl"><div class="tr-seek"><input class="tr-sr" type="range" min="0" max="1000" value="0" aria-label="Seek"></div>' +
      '<div class="tr-vr"><button class="tr-b" data-a="back" aria-label="Back 10 seconds">⏪ 10</button><button class="tr-b" data-a="toggle" data-p="1" aria-label="Play or pause">▶</button>' +
      '<button class="tr-b" data-a="fwd" aria-label="Forward 10 seconds">10 ⏩</button><span class="tr-time">0:00 / 0:00</span><span style="flex:1"></span>' +
      '<button class="tr-b" data-a="speed" aria-label="Playback speed">1×</button><button class="tr-b" data-a="mute" aria-label="Mute">🔊</button>' +
      (canFs ? '<button class="tr-b" data-a="fs" aria-label="Full screen">⛶</button>' : '') + '</div></div></div>' + LOADER + '</div>');
    document.body.appendChild(V.ov);
    var ov = V.ov, v = V.v = $('video', ov), sr = $('.tr-sr', ov);
    ov.addEventListener('click', function (e) { var b = e.target.closest('[data-a]'); if (b) { vidAct(b.getAttribute('data-a')); vShow(); } });
    v.addEventListener('click', function () { vidAct('toggle'); vShow(); });
    v.addEventListener('dblclick', function () { if (canFs) vidAct('fs'); });
    v.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    ['pointermove', 'touchstart'].forEach(function (t) { ov.addEventListener(t, vShow, { passive: true }); });
    ['timeupdate', 'durationchange', 'loadedmetadata', 'seeked'].forEach(function (t) { v.addEventListener(t, vSync); });
    ['play', 'pause', 'ended'].forEach(function (t) { v.addEventListener(t, function () { pSync(); vShow(); }); });
    v.addEventListener('waiting', function () { $('.tr-wait', ov).style.display = 'block'; });
    ['playing', 'canplay', 'seeked'].forEach(function (t) { v.addEventListener(t, function () { $('.tr-wait', ov).style.display = 'none'; }); });
    v.addEventListener('loadedmetadata', function () {
      var t = Number(vpGet()); if (t > 5 && isFinite(v.duration) && t < v.duration - 10) { try { v.currentTime = t; } catch (e) {} }
    });
    v.addEventListener('ended', function () { vpSet(0); });
    v.addEventListener('error', function () {
      if (!V.open || !v.getAttribute('src')) return;
      V.t = v.currentTime || 0; $('.tr-err p', ov).textContent = 'This video stopped playing. Check your connection and try again.'; $('.tr-err', ov).style.display = 'flex';
    });
    sr.addEventListener('input', function () { V.drag = true; var d = isFinite(v.duration) ? v.duration : 0; $('.tr-time', ov).textContent = mmss(sr.value / 1000 * d) + ' / ' + mmss(d); vShow(); });
    sr.addEventListener('change', function () { var d = isFinite(v.duration) ? v.duration : 0; if (d) v.currentTime = sr.value / 1000 * d; V.drag = false; });
    document.addEventListener('fullscreenchange', fsChange); document.addEventListener('webkitfullscreenchange', fsChange);
  }
  function fsChange() {   // try to turn the phone sideways while the video is full screen
    if (!V.open) return;
    try { if (G.screen && G.screen.orientation) { if (fsEl() === V.ov && G.screen.orientation.lock) G.screen.orientation.lock('landscape').catch(function () {}); else if (G.screen.orientation.unlock) G.screen.orientation.unlock(); } } catch (e) {}
  }
  function vpKey() { return 'vp_' + (V.x && V.x.fileId); }
  function vpGet() { try { return G.LS ? G.LS.get(vpKey()) : localStorage.getItem(vpKey()); } catch (e) { return 0; } }
  function vpSet(t) { try { if (G.LS) G.LS.set(vpKey(), String(Math.floor(t))); else localStorage.setItem(vpKey(), String(Math.floor(t))); } catch (e) {} }
  function vSync() {
    var v = V.v, d = isFinite(v.duration) ? v.duration : 0, t = v.currentTime || 0;
    if (!V.drag) { $('.tr-sr', V.ov).value = d ? Math.round(t / d * 1000) : 0; $('.tr-time', V.ov).textContent = mmss(t) + ' / ' + mmss(d); }
    if (Date.now() - (V.sv || 0) > 5000 && t > 5) { V.sv = Date.now(); vpSet(t); }
  }
  function pSync() {
    var v = V.v, pl = !v.paused && !v.ended; $('[data-p]', V.ov).textContent = pl ? '⏸' : (v.ended ? '↻' : '▶');
    var big = $('.tr-big', V.ov); big.textContent = v.ended ? '↻' : '▶'; big.style.display = pl || !V.ready ? 'none' : 'block';
  }
  function vShow() {
    var ov = V.ov; ov.classList.remove('hide'); clearTimeout(V.ht);
    if (V.ready && !V.v.paused && !V.v.ended) V.ht = setTimeout(function () { ov.classList.add('hide'); }, 3000);
  }
  function vPlay() { var p = V.v.play(); if (p && p.catch) p.catch(function () { pSync(); }); }
  function skip(d) { var v = V.v, t = (v.currentTime || 0) + d; v.currentTime = Math.max(0, isFinite(v.duration) ? Math.min(v.duration, t) : t); }
  function vidAct(a) {
    var v = V.v;
    if (a === 'close') closeVid();
    else if (a === 'toggle') { if (!V.ready) return; if (v.ended) v.currentTime = 0; if (v.paused) vPlay(); else v.pause(); }
    else if (a === 'back') skip(-10); else if (a === 'fwd') skip(10);
    else if (a === 'speed') { V.ri = ((V.ri || 0) + 1) % RATES.length; v.playbackRate = RATES[V.ri]; $('[data-a=speed]', V.ov).textContent = RATES[V.ri] + '×'; }
    else if (a === 'mute') { v.muted = !v.muted; $('[data-a=mute]', V.ov).textContent = v.muted ? '🔇' : '🔊'; }
    else if (a === 'fs') { if (fsEl() === V.ov) fsOff(); else fsOn(V.ov); }
    else if (a === 'retry') { $('.tr-err', V.ov).style.display = 'none'; var t = V.t || 0; v.load(); v.addEventListener('loadedmetadata', function once() { v.removeEventListener('loadedmetadata', once); try { v.currentTime = t; } catch (e) {} vPlay(); }); }
  }
  async function dl(x, id) {
    var CH = cfg().chunkBytes || 3145728, RET = 3, PAR = 3, got = 0, ov = V.ov;
    async function one(start) {
      var last;
      for (var a = 0; a < RET; a++) {
        if (id !== V.id) throw new Error('cancelled');
        try { return await G.api('get_video_chunk', { file_id: x.fileId, start: start, length: CH }); }
        catch (e) { last = e; if (/expired|plan|suspend|session|log in|large|available/i.test(e.message)) throw e; await new Promise(function (r) { setTimeout(r, 800 * (a + 1)); }); }
      }
      throw last || new Error('Download failed. Check your connection.');
    }
    ld(ov, 'Downloading securely…', 0);
    var f = await one(0), total = f.total;
    if (!total) throw new Error('This video is unavailable.');
    if (total > MAXV) throw new Error('This video is too large for this device.');
    var n = Math.ceil(total / CH), parts = new Array(n);
    function keep(i, r) { var u = b2u(r.base64); parts[i] = u; got += u.length; if (id === V.id) ld(ov, 'Downloading securely. Keep this window open.', got / total, mb(got) + ' of ' + mb(total)); }
    keep(0, f);
    var next = 1, fail = null;
    async function worker() { while (!fail) { var i = next++; if (i >= n) return; try { keep(i, await one(i * CH)); } catch (e) { fail = e; return; } } }
    var ws = []; for (var w = 0; w < Math.min(PAR, n - 1); w++) ws.push(worker());
    await Promise.all(ws);
    if (fail) throw fail; if (id !== V.id) throw new Error('cancelled');
    for (var i = 0; i < n; i++) if (!parts[i]) throw new Error('Download incomplete. Please try again.');
    return new Blob(parts, { type: f.mimeType || 'video/mp4' });
  }
  function resetVid() {
    var v = V.v; v.pause(); v.removeAttribute('src'); if (V.url) { URL.revokeObjectURL(V.url); V.url = null; }
    V.ready = false; V.ri = 0; V.drag = false; v.playbackRate = 1; v.muted = false;
    $('[data-a=speed]', V.ov).textContent = '1×'; $('[data-a=mute]', V.ov).textContent = '🔊'; $('.tr-err', V.ov).style.display = 'none';
    $('.tr-wait', V.ov).style.display = 'none'; $('.tr-big', V.ov).style.display = 'none'; $('.tr-sr', V.ov).value = 0; $('.tr-time', V.ov).textContent = '0:00 / 0:00';
  }
  async function openVid(x) {
    buildVid(); var id = ++V.id, ov = V.ov;
    V.open = true; V.x = x; resetVid(); ov.classList.remove('hide'); ov.classList.add('on'); lock();
    $('.tr-title', ov).textContent = x.title || 'Video';
    try {
      var blob = await dl(x, id); if (id !== V.id) return;
      V.url = URL.createObjectURL(blob); V.v.src = V.url; V.ready = true; ldOff(ov); pSync(); vPlay(); vShow();
    } catch (e) {
      if (id !== V.id || (e && e.message === 'cancelled')) return;
      ldErr(ov, e.message || 'Could not load this video.');
    }
  }
  function closeVid() {
    V.id++; V.open = false; clearTimeout(V.ht); if (V.v && !V.v.paused) vpSet(V.v.currentTime || 0);
    resetVid(); if (fsEl() === V.ov) fsOff();
    try { if (G.screen && G.screen.orientation && G.screen.orientation.unlock) G.screen.orientation.unlock(); } catch (e) {}
    V.ov.classList.remove('on'); unlock();
  }
  function vidKey(e) {
    var k = e.key; if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === 'Escape') { e.preventDefault(); closeVid(); return; }
    if (!V.ready) return;
    if (k === ' ' || k === 'k' || k === 'K') { e.preventDefault(); vidAct('toggle'); }
    else if (k === 'ArrowLeft') { e.preventDefault(); skip(-5); } else if (k === 'ArrowRight') { e.preventDefault(); skip(5); }
    else if (k === 'j' || k === 'J') skip(-10); else if (k === 'l' || k === 'L') skip(10);
    else if ((k === 'f' || k === 'F') && canFs) vidAct('fs'); else if (k === 'm' || k === 'M') vidAct('mute'); else return;
    vShow();
  }
  document.addEventListener('keydown', function (e) { if (D.open && D.ov && D.ov.classList.contains('on')) docKey(e); else if (V.open) vidKey(e); });

  /* ═════════ HOOK IN ═════════ */
  G.viewDoc = openDoc; G.viewVid = openVid;
})();
</script>
